name: Examples Release
run-name: Go examples ${{ inputs.sdk_sha }} mode=${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Sign artifact only, publish, or recover one explicitly frozen examples artifact
        required: true
        default: artifact-only
        type: choice
        options: [artifact-only, publish, recover]
      sdk_sha:
        description: Original formally completed Go SDK source SHA
        required: true
        type: string
      candidate_run_id:
        description: Original Go SDK candidate run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Original Go SDK candidate attempt
        required: true
        type: string
      completion_run_id:
        description: Successful Go SDK completion run ID
        required: true
        type: string
      completion_run_attempt:
        description: Successful Go SDK completion attempt
        required: true
        type: string
      completion_source_sha:
        description: Go SDK completion source SHA
        required: true
        type: string
      core_commit:
        description: Exact core authority commit
        required: true
        type: string
      core_tag:
        description: Exact formally published core tag
        required: true
        type: string
      npm_sha:
        description: Original independently completed TypeScript source
        required: true
        type: string
      pypi_sha:
        description: Original independently completed Python source
        required: true
        type: string
      examples_run_id:
        description: Recover only explicit original examples run ID
        required: false
        type: string
      examples_run_attempt:
        description: Recover only explicit original examples attempt
        required: false
        type: string
      examples_artifact_id:
        description: Recover only exact original examples artifact ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: go-examples-${{ inputs.sdk_sha }}
  cancel-in-progress: false

jobs:
  examples-candidate:
    if: ${{ inputs.mode != 'recover' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # Preserve Git blob bytes so checkout cannot change authenticated source digests.
      # 保留 Git blob 原字节，避免检出改变已认证的源摘要。
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills
          ref: ${{ inputs.core_commit }}
          path: core-release
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills-sdk-typescript
          ref: ${{ inputs.npm_sha }}
          path: npm-release
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills-sdk-python
          ref: ${{ inputs.pypi_sha }}
          path: pypi-release
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Authenticate and install exact public core Rust toolchain
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          CORE_TAG: ${{ inputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/go_release.py bootstrap --core-root "$GITHUB_WORKSPACE/core-release" --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT" --platform host --output "$RUNNER_TEMP/rust-bootstrap"
          toolchain="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/rust-bootstrap/toolchain.json"))["toolchain"])')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Authenticate both permanent SDK chains and real fresh consumers
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPLETION_RUN: ${{ inputs.completion_run_id }}
          COMPLETION_ATTEMPT: ${{ inputs.completion_run_attempt }}
          COMPLETION_SOURCE: ${{ inputs.completion_source_sha }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          CORE_TAG: ${{ inputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release/go_release.py formal-proof --sdk-sha "$SDK_SHA" --sdk-version "$version" --candidate-run-id "$CANDIDATE_RUN" --candidate-run-attempt "$CANDIDATE_ATTEMPT" --completion-run-id "$COMPLETION_RUN" --completion-run-attempt "$COMPLETION_ATTEMPT" --completion-source-sha "$COMPLETION_SOURCE" --core-root "$GITHUB_WORKSPACE/core-release" --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT" --npm-root "$GITHUB_WORKSPACE/npm-release" --pypi-root "$GITHUB_WORKSPACE/pypi-release" --platform host --output "$RUNNER_TEMP/formal"
      - name: Run six public-module examples using exact verified independent TypeScript installer
        working-directory: sdk
        shell: bash
        run: python scripts/release/go_release.py examples --core-root "$GITHUB_WORKSPACE/core-release" --formal "$RUNNER_TEMP/formal" --output "$RUNNER_TEMP/examples"
      - name: Freeze deterministic ZIP and original sidecar for signing
        working-directory: sdk
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: python scripts/release/go_release.py examples-stage --core-root "$GITHUB_WORKSPACE/core-release" --formal "$RUNNER_TEMP/formal" --examples "$RUNNER_TEMP/examples" --mode "$MODE" --output "$RUNNER_TEMP/examples-stage"
      - name: Official OIDC examples signature
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: ${{ runner.temp }}/examples-stage/subjects.sha256
      - name: Preserve authenticated original example bytes
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: python scripts/release/go_release.py examples-finalize --core-root "$GITHUB_WORKSPACE/core-release" --formal "$RUNNER_TEMP/formal" --directory "$RUNNER_TEMP/examples-stage" --bundle "$BUNDLE" --output "$RUNNER_TEMP/examples-artifact"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: candidate-evidence-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/examples-artifact/*
          if-no-files-found: error

  examples-publish:
    needs: examples-candidate
    if: ${{ always() && ((inputs.mode == 'publish' && needs.examples-candidate.result == 'success') || inputs.mode == 'recover') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # Preserve Git blob bytes so checkout cannot change authenticated source digests.
      # 保留 Git blob 原字节，避免检出改变已认证的源摘要。
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sdk_sha }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills
          ref: ${{ inputs.core_commit }}
          path: core-release
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills-sdk-typescript
          ref: ${{ inputs.npm_sha }}
          path: npm-release
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LuaSkills/luaskills-sdk-python
          ref: ${{ inputs.pypi_sha }}
          path: pypi-release
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Authenticate and install exact public core Rust toolchain
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          CORE_TAG: ${{ inputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release/go_release.py bootstrap --core-root "$GITHUB_WORKSPACE/core-release" --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT" --platform host --output "$RUNNER_TEMP/rust-bootstrap"
          toolchain="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/rust-bootstrap/toolchain.json"))["toolchain"])')"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Authenticate both permanent SDK chains and real fresh consumers
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ inputs.sdk_sha }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          COMPLETION_RUN: ${{ inputs.completion_run_id }}
          COMPLETION_ATTEMPT: ${{ inputs.completion_run_attempt }}
          COMPLETION_SOURCE: ${{ inputs.completion_source_sha }}
          CORE_COMMIT: ${{ inputs.core_commit }}
          CORE_TAG: ${{ inputs.core_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release/go_release.py formal-proof --sdk-sha "$SDK_SHA" --sdk-version "$version" --candidate-run-id "$CANDIDATE_RUN" --candidate-run-attempt "$CANDIDATE_ATTEMPT" --completion-run-id "$COMPLETION_RUN" --completion-run-attempt "$COMPLETION_ATTEMPT" --completion-source-sha "$COMPLETION_SOURCE" --core-root "$GITHUB_WORKSPACE/core-release" --core-tag "$CORE_TAG" --core-commit "$CORE_COMMIT" --npm-root "$GITHUB_WORKSPACE/npm-release" --pypi-root "$GITHUB_WORKSPACE/pypi-release" --platform host --output "$RUNNER_TEMP/formal"
      - name: Consume original signed artifact and publish identical ZIP and sidecar without rebuilding
        working-directory: sdk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          RECOVER_RUN: ${{ inputs.examples_run_id }}
          RECOVER_ATTEMPT: ${{ inputs.examples_run_attempt }}
          RECOVER_ARTIFACT: ${{ inputs.examples_artifact_id }}
          CURRENT_ARTIFACT: ${{ needs.examples-candidate.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" == recover ]]; then
            original_run="$RECOVER_RUN"; original_attempt="$RECOVER_ATTEMPT"; original_artifact="$RECOVER_ARTIFACT"
          else
            original_run="$GITHUB_RUN_ID"; original_attempt="$GITHUB_RUN_ATTEMPT"; original_artifact="$CURRENT_ARTIFACT"
          fi
          python scripts/release/go_release.py examples-publish --core-root "$GITHUB_WORKSPACE/core-release" --formal "$RUNNER_TEMP/formal" --intent "$MODE" --examples-run-id "$original_run" --examples-run-attempt "$original_attempt" --examples-artifact-id "$original_artifact" --output "$RUNNER_TEMP/original-examples"
